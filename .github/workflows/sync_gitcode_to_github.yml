name: Sync GitCode to GitHub

# Runs in the publishing fork. The workflow and script must be on its default
# branch. UPSTREAM_PR_TOKEN must allow fork pushes and upstream PR creation.
on:
  schedule:
    # Monday-Friday 09:00 Beijing. GitHub scheduling is best-effort.
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      source_ref:
        description: GitCode source branch
        default: master
      target_branch:
        description: GitHub upstream target branch
        default: main
      sync_branch:
        description: Fork branch for synchronized changes
        default: gitcode-sync
      cut_point:
        description: Full source SHA, or auto to continue from the last merged sync PR
        default: auto
      dry_run:
        description: Validate and replay without pushing or changing a PR
        type: choice
        default: 'false'
        options: ['true', 'false']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-gitcode-to-github
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'chenshengxin2026/pto-isa'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_UPSTREAM: hw-native-sys/pto-isa
      GITCODE_UPSTREAM_URL: https://gitcode.com/cann/pto-isa.git
      BOOTSTRAP_CUT_POINT: 29dc4a9565a39320c8011488748ee583842b4d0d
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      INPUT_SOURCE_REF: ${{ inputs.source_ref || 'master' }}
      INPUT_TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
      INPUT_SYNC_BRANCH: ${{ inputs.sync_branch || 'gitcode-sync' }}
      INPUT_CUT_POINT: ${{ inputs.cut_point || 'auto' }}
      INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      UPSTREAM_PR_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
      GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_PR_TOKEN || github.token }}
      - name: Preserve the selected workflow script before switching branches
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitcode-sync"
          cp .github/scripts/sync_gitcode.py "$RUNNER_TEMP/gitcode-sync/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Validate dependencies, replay commits, and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/gitcode-sync/sync_gitcode.py" 2>&1 | tee "$RUNNER_TEMP/gitcode-sync.log"
      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitcode-sync-diagnostics
          path: ${{ runner.temp }}/gitcode-sync.log
          if-no-files-found: ignore
